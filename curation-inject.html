<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>策展一鍵注入 — 貼給任何 AI，自動上架網站</title>
<meta name="robots" content="noindex, nofollow">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800;900&display=swap');
:root {
  --bg: #FFFBF5; --bg-warm: #FFF8EC; --bg-deep: #FFF3DC; --surface: #FFFFFF;
  --border: #F0E4D0; --border-strong: #E0D0B0;
  --primary: #D4692A; --primary-dark: #A84820;
  --green: #4A8B70; --green-dark: #2F6B52;
  --text: #3D2B1F; --text-dim: #7A6A5A; --text-muted: #A89880;
  --shadow-lg: 0 16px 48px rgba(61,43,31,0.18);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: 'Noto Sans TC', -apple-system, sans-serif;
  line-height: 1.8; font-size: 17px; font-weight: 500;
  min-height: 100vh; display: flex; flex-direction: column; align-items: center;
  padding: 64px 20px;
}
.container { max-width: 640px; width: 100%; }
.eyebrow {
  display: inline-block; padding: 6px 16px; background: rgba(74,139,112,.12);
  color: var(--green-dark); border-radius: 999px; font-size: 14px; font-weight: 700; margin-bottom: 20px;
}
h1 { font-size: clamp(26px,4vw,36px); font-weight: 900; margin-bottom: 12px; }
h1 .accent { color: var(--primary); }
.sub { color: var(--text-dim); font-weight: 600; margin-bottom: 36px; }
.copy-zone {
  background: var(--surface); border: 2px solid var(--primary); border-radius: 24px;
  padding: 36px 28px; box-shadow: var(--shadow-lg); text-align: center;
}
.copy-zone-hint { font-size: 15px; color: var(--text-dim); margin-bottom: 24px; }
.btn-copy {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  color: #fff; font-size: 18px; font-weight: 800; padding: 18px 36px; border: none;
  border-radius: 999px; cursor: pointer; box-shadow: 0 8px 24px rgba(212,105,42,.4);
  transition: all .2s; font-family: inherit; width: 100%;
}
.btn-copy:hover { transform: translateY(-2px); }
.btn-copy.copied { background: linear-gradient(135deg, var(--green) 0%, var(--green-dark) 100%); }
.how {
  margin-top: 32px; text-align: left; font-size: 14px; color: var(--text-dim);
  background: var(--bg-deep); border-radius: 14px; padding: 18px 20px;
}
.how b { color: var(--text); }
.warn {
  margin-top: 20px; font-size: 13px; color: var(--text-muted); text-align: center; line-height: 1.7;
}
.toast {
  position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(80px);
  background: var(--green-dark); color: #fff; padding: 14px 28px; border-radius: 999px;
  font-weight: 700; font-size: 15px; box-shadow: var(--shadow-lg); opacity: 0;
  transition: all .3s; z-index: 999; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="container">
  <span class="eyebrow">🎯 策展 SOP</span>
  <h1>策展<span class="accent">一鍵注入</span></h1>
  <p class="sub">遇到任何AI（Claude / Hermes / OpenCode / ChatGPT...），複製這段貼給它，就能幫你把打包好的網站上架。</p>

  <div class="copy-zone">
    <div class="copy-zone-hint">點按鈕 → 貼到任何 AI 對話框 → 告訴它檔案在哪 → 自動上架</div>
    <button id="copyBtn" class="btn-copy" onclick="copyPrompt()">
      📋 <span id="copyBtnText">一鍵複製策展指令</span>
    </button>
  </div>

  <div class="how">
    <b>怎麼用：</b>複製 → 貼給任何AI → 那個AI會反問你「檔案在哪裡」→ 你回答路徑（或直接把檔案傳給它）→ 它會自動上傳，10~20秒後你會收到Telegram通知，附上新網址。
  </div>
  <div class="warn">
    這段指令內含一把「策展專用上傳鑰匙」，只能拿來上傳網站，不是後台登入密碼。如果要收回這把鑰匙，直接請軍師換一把新的即可，不影響其他系統。
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const PROMPT_URL = 'curation-prompt.md';
let promptCache = null;
async function loadPrompt() {
  if (promptCache) return promptCache;
  const res = await fetch(PROMPT_URL);
  if (!res.ok) throw new Error('載入失敗：' + res.status);
  promptCache = await res.text();
  return promptCache;
}
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.left = '0';
  ta.style.opacity = '0'; ta.style.pointerEvents = 'none';
  document.body.appendChild(ta); ta.focus(); ta.select();
  const ok = document.execCommand('copy');
  document.body.removeChild(ta);
  if (!ok) throw new Error('execCommand copy failed');
}
async function copyPrompt() {
  const btn = document.getElementById('copyBtn');
  const btnText = document.getElementById('copyBtnText');
  const original = btnText.textContent;
  try {
    const text = await loadPrompt();
    await navigator.clipboard.writeText(text);
    btn.classList.add('copied'); btnText.textContent = '✅ 已複製！貼給 AI 即可';
    showToast('✅ 已複製到剪貼簿，貼給 AI 即可');
    setTimeout(() => { btn.classList.remove('copied'); btnText.textContent = original; }, 3500);
  } catch (e) {
    try {
      const text = await loadPrompt();
      fallbackCopy(text);
      btn.classList.add('copied'); btnText.textContent = '✅ 已複製（相容模式）！';
      showToast('✅ 已複製到剪貼簿（相容模式）');
      setTimeout(() => { btn.classList.remove('copied'); btnText.textContent = original; }, 3500);
    } catch (e2) {
      btnText.textContent = '⚠️ 複製失敗，請用 Cmd+A 全選後 Cmd+C';
      showToast('⚠️ 自動複製失敗，請手動選取複製');
    }
  }
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
</body>
</html>
